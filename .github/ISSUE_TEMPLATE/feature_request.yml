name: Feature request
description: Suggest a new feature, car, district, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
    validations:
      required: true
