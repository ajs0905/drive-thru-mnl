name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # The project's Node version, the same as Vercel's (package.json engines): a new
          # Node release changes nothing until .nvmrc does.
          node-version-file: .nvmrc
          cache: npm

      # No deprecated packages (ADR 0031, ADR 0033): fails if npm warns about any.
      - name: Install, no deprecated packages
        run: |
          npm ci 2>&1 | tee install.log
          if grep -i "npm warn deprecated" install.log; then exit 1; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (fail on any deprecation warning)
        run: npm test

      - name: Map data matches the pipeline
        run: npm run data:check

      - name: Map QA has no regressions
        run: npm run qa:check

      - name: Production build, within the size budgets and without deprecation warnings
        run: npm run size
