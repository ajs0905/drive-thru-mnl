<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The game draws its own colors: phone browsers that darken pages on their own (forced dark mode) must leave its white sign borders and icons alone. -->
    <meta name="color-scheme" content="only light" />
    <!-- The menu backdrop: fetched with the page, not after the scripts have run (portrait on narrow screens, see src/ui/backdrop.ts). -->
    <link rel="preload" as="image" href="%BASE_URL%menu.jpg" media="not all and (max-aspect-ratio: 2/3)" fetchpriority="high" />
    <link rel="preload" as="image" href="%BASE_URL%menu-portrait.jpg" media="(max-aspect-ratio: 2/3)" fetchpriority="high" />
    <title>Drive Thru MNL: No Traffic Edition?</title>
    <meta name="description" content="Drive a low-poly Bonifacio Global City (BGC), Taguig, built from real OpenStreetMap data, in your browser. Free roam, cargo runs and traffic, on desktop and phone." />
    <link rel="canonical" href="https://drive-thru-mnl.vercel.app/" />
    <!-- Link previews (chat apps, social sites): the picture needs a full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drive Thru MNL" />
    <meta property="og:url" content="https://drive-thru-mnl.vercel.app/" />
    <meta property="og:title" content="Drive Thru MNL: No Traffic Edition?" />
    <meta property="og:description" content="Drive a low-poly BGC, Taguig, built from real OpenStreetMap data, in your browser. Free roam, cargo runs and traffic, on desktop and phone." />
    <meta property="og:image" content="https://drive-thru-mnl.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A low-poly sedan driving past traffic and office towers on a BGC avenue" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
